name: '[Test] Test siibra-tutorials'

# Pushes, pull requests and the weekly run test the notebooks the way Binder users run
# them: with runtime.txt and requirements.txt, i.e. the latest siibra release. siibra-python's
# own cron-siibra-tutorials workflow covers siibra-python's main branch; to
# test another branch here, start this workflow manually and name it.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"  # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      siibra_python_branch:
        description: 'siibra-python branch to test with (empty: the release from requirements.txt)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  # A newer run replaces an older one only if both have the same trigger, branch
  # or PR, and siibra-python branch: two manual runs testing different branches,
  # or a manual run and a push to main, no longer cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.siibra_python_branch }}
  cancel-in-progress: true

jobs:
  check-clean:
    # Fast checks that need neither siibra nor its data: notebooks are stored without outputs
    # and environment metadata, and no cell uses a name that no earlier cell defines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check notebooks are stripped of outputs and metadata
        run: python3 .github/scripts/clean_notebooks.py --check

      - name: Check notebooks for names used before they are defined
        run: |
          python3 -m pip install "$(grep '^pyflakes==' .github/requirements-tests.txt)"
          python3 .github/scripts/check_notebook_names.py

  list-notebooks:
    # Branches in this repository are already tested by their push run, so the
    # pull_request run is only needed for pull requests from forks.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.find.outputs.notebooks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find notebooks
        id: find
        shell: bash
        run: |
          notebooks=$(git ls-files '*.ipynb' | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().splitlines()))')
          echo "$notebooks"
          echo "notebooks=$notebooks" >> "$GITHUB_OUTPUT"

  test-notebook:
    # One job per notebook: each runs on its own runner with its own siibra
    # cache, so nothing is shared between notebooks running in parallel.
    needs: list-notebooks
    name: ${{ matrix.notebook }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        notebook: ${{ fromJSON(needs.list-notebooks.outputs.notebooks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Python version Binder uses
        id: runtime
        shell: bash
        run: |
          # runtime.txt ("python-3.X") sets the Python version on mybinder.org; test with the same one.
          version=$(sed -n 's/^python-//p' runtime.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.runtime.outputs.version }}
          check-latest: true
          cache: pip
          cache-dependency-path: |
            runtime.txt
            requirements.txt
            .github/requirements-tests.txt

      - name: Install dependencies
        shell: bash
        env:
          SIIBRA_BRANCH: ${{ inputs.siibra_python_branch }}
        run: |
          extra=()
          if [[ -n "$SIIBRA_BRANCH" ]]; then
            # pip passes the branch to git as a command-line argument, so it must not
            # start with "-" (git options). Git branch names never start with "-" or ".".
            if [[ ! "$SIIBRA_BRANCH" =~ ^[A-Za-z0-9_][A-Za-z0-9._/-]*$ ]]; then
              echo "::error::Invalid siibra-python branch name: $SIIBRA_BRANCH"
              exit 1
            fi
            extra=("siibra @ git+https://github.com/FZJ-INM1-BDA/siibra-python.git@${SIIBRA_BRANCH}")
          fi
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r .github/requirements-tests.txt \
            "${extra[@]}"

      - name: Run notebook
        shell: bash
        env:
          NOTEBOOK: ${{ matrix.notebook }}
        run: python -m pytest --nbmake --nbmake-timeout=1200 "./$NOTEBOOK"
